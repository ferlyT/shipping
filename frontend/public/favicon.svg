<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main background gradient: deep navy to electric blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>

    <!-- Accent glow gradient for the 'm' -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>

    <!-- Subtle top-left shine -->
    <radialGradient id="shineGrad" cx="25%" cy="20%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- Drop shadow filter for the 'm' -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Glow filter for the arrow accent -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- Shine overlay -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#shineGrad)"/>

  <!-- Subtle inner border for depth -->
  <rect x="2" y="2" width="508" height="508" rx="95" ry="95"
        fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

  <!-- The 'm' letterform — bold, centered -->
  <text
    x="256"
    y="330"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="280"
    letter-spacing="-8"
    fill="url(#mGrad)"
    filter="url(#shadow)"
  >m</text>

  <!-- Speed/delivery accent: three small horizontal lines (motion lines) bottom-right -->
  <g filter="url(#glow)" opacity="0.85">
    <rect x="348" y="358" width="72" height="8" rx="4" fill="#60a5fa"/>
    <rect x="362" y="376" width="58" height="8" rx="4" fill="#93c5fd"/>
    <rect x="376" y="394" width="44" height="8" rx="4" fill="#bfdbfe"/>
  </g>

  <!-- Small upward arrow tip above motion lines -->
  <polygon points="420,330 408,358 432,358" fill="#60a5fa" opacity="0.9" filter="url(#glow)"/>
</svg>