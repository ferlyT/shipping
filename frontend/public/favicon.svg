<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate to Dark Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle inner border for contrast on both dark and light browser tabs -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>
  </defs>

  <!-- Rounded container matching the app logo rounded-lg background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="506" height="506" rx="105" ry="105" fill="none" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Package Icon (Exact Lucide Package geometry matching Sidebar app logo) -->
  <g transform="translate(96, 96) scale(13.333333)" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer 3D package cube -->
    <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
    <!-- Vertical crease -->
    <path d="M12 22V12" />
    <!-- Top flap crease -->
    <polyline points="3.29 7 12 12 20.71 7" />
    <!-- Tape / seal band across top flap -->
    <path d="m7.5 4.27 9 5.15" />
  </g>
</svg>