name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Expo Prebuild Android
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Configure Keystore and Dual Signing (v1 + v2)
        working-directory: ./mobile
        run: |
          cp keystore/debug.keystore android/app/debug.keystore
          sed -i '/keyPassword .android./a \            v1SigningEnabled true\n            v2SigningEnabled true' android/app/build.gradle

      - name: Build Android Release APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign & Verify APK with apksigner (Dual v1 + v2)
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER on $APK_PATH"
          $APKSIGNER sign --ks mobile/keystore/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$APK_PATH"
          $APKSIGNER verify --verbose "$APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mshipping-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.0.0
          name: "M-Shipping Mobile v1.0.0"
          body: "Aplikasi mobile resmi ERP M-Shipping (Release APK)"
          files: mobile/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
